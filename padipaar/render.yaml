services:
  - type: web
    name: padipaar
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python -m app.train
    startCommand: gunicorn wsgi:app --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 60
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: ALLOWED_ORIGINS
        value: "*"
